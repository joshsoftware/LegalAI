# Local stack: Postgres, a local LLM (Ollama), OCR inference (Surya), the
# combined backend (app/translation/field_mapping/ocr/gateway), and the
# frontend.
#
# Backend services that need GPU (ollama, surya-inference) come in "cpu"/"gpu"
# pairs, selected via COMPOSE_PROFILES in .env (defaults to "cpu").
services:
  db:
    image: postgres:16
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-lending_poc}
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  ollama:
    &ollama
    image: ollama/ollama:latest
    profiles: ["cpu"]
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: -1
    volumes:
      - ollama_models:/root/.ollama

  ollama-gpu:
    <<: *ollama
    profiles: ["gpu"]
    networks:
      default:
        aliases:
          - ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  surya-inference:
    &surya-inference
    build:
      context: ./surya-inference
      args:
        LLAMA_IMAGE: ghcr.io/ggml-org/llama.cpp:server
    profiles: ["cpu"]
    environment:
      SURYA_INFERENCE_PARALLEL: ${SURYA_INFERENCE_PARALLEL:-4}
      SURYA_INFERENCE_CTX_SIZE: ${SURYA_INFERENCE_CTX_SIZE:-49152}
    volumes:
      - surya_models:/models

  surya-inference-gpu:
    <<: *surya-inference
    profiles: ["gpu"]
    build:
      context: ./surya-inference
      args:
        LLAMA_IMAGE: ghcr.io/ggml-org/llama.cpp:server-cuda
    networks:
      default:
        aliases:
          - surya-inference
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  backend:
    build:
      context: .
      args:
        GPU: "0"
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER:-postgresql+asyncpg://postgres:postgres@db:5432/lending_poc}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma4:e4b-it-qat}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-1800}
      SURYA_INFERENCE_URL: http://surya-inference:8000/v1
      SURYA_INFERENCE_AUTOSTART: "false"
      APP_BASE_URL: http://127.0.0.1:8000
      TRANSLATION_BASE_URL: http://127.0.0.1:8001
      FIELD_MAPPING_BASE_URL: http://127.0.0.1:8002
      OCR_BASE_URL: http://127.0.0.1:8010
      OCR_REQUEST_TIMEOUT_SECONDS: ${OCR_REQUEST_TIMEOUT_SECONDS:-1800}
      TRANSLATION_REQUEST_TIMEOUT_SECONDS: ${TRANSLATION_REQUEST_TIMEOUT_SECONDS:-1800}
      FIELD_MAPPING_REQUEST_TIMEOUT_SECONDS: ${FIELD_MAPPING_REQUEST_TIMEOUT_SECONDS:-1800}
      APP_REQUEST_TIMEOUT_SECONDS: ${APP_REQUEST_TIMEOUT_SECONDS:-1800}
    volumes:
      - .:/app
      - hf_cache:/root/.cache/huggingface
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started
        required: false
      ollama-gpu:
        condition: service_started
        required: false
      surya-inference:
        condition: service_started
        required: false
      surya-inference-gpu:
        condition: service_started
        required: false

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8080
      VITE_TRANSLATION_API_BASE_URL: http://localhost:8080
    volumes:
      - ./frontend:/app
      - /app/node_modules

# Named volumes so DB data and downloaded ML model weights survive
# container recreation instead of being re-fetched/reset every time.
volumes:
  pgdata:
  ollama_models:
  surya_models:
  hf_cache:

